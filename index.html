<script>
(function () {
  // Send the visitor to their language: remembered choice first, browser language second.
  var lang = null;
  try { lang = localStorage.getItem("hm-lang"); } catch (e) {}
  if (lang !== "en" && lang !== "nl") {
    lang = (navigator.language || "").toLowerCase().indexOf("nl") === 0 ? "nl" : "en";
  }
  location.replace("/" + lang + "/");
})();
</script>
