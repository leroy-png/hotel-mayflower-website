name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build _site with correct base path
        run: python3 tools/build_site.py --base "${{ steps.pages.outputs.base_path }}" --version "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Production build for the cPanel server: no base path, cache-busted assets.
  # cPanel's Git Version Control clones the production branch; .cpanel.yml
  # (included in the build) copies the files into public_html/hotel.
  production-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build production site
        run: python3 tools/build_site.py --version "${{ github.sha }}"
      - name: Commit build onto production branch (append-only, cPanel-friendly)
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin production || true
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            git worktree add ../prod origin/production
          else
            git worktree add --orphan -b production ../prod
          fi
          rsync -a --delete --exclude=.git _site/ ../prod/
          cd ../prod
          git checkout -B production
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy ${GITHUB_SHA:0:8}" || { echo "no changes to deploy"; exit 0; }
          git push "$REMOTE" production
